name: Node.js tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - feature/datapulse-academic-tools

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies and synchronize lockfile
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
