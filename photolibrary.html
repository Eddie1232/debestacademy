<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Library</title>
    <link rel="stylesheet" href="./debest.css" />
  </head>
  <body>
    <header>
      <div class="crest-container" aria-label="School Crest">
        <img src="./debestcrest.jpg" alt="Debest Crest" />
      </div>
      <a class="home-btn" href="debest.html" aria-label="Go to Home page" title="Home">🏠</a>
      <h1>DEBEST ACADEMY</h1>

      <nav role="navigation" aria-label="Primary Navigation">
        <ul id="nav-menu">
          <li><a href="debest.html#about">About Us</a></li>
          <li><a href="debest.html#admission">Admission</a></li>
          <li><a href="debest.html#news">News</a></li>
          <li><a href="students-and-parents-platforms.html">Platforms</a></li>
          <li><a href="debest.html#faq">FAQs</a></li>
          <li><a href="debest.html#contact">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main class="container" role="main">
      <section id="photo" aria-labelledby="photo-title">
        <h3 id="photo-title">Photo Library</h3>
        <p class="section-lead">
          A glimpse into the learning, creativity, culture, and community life at DEBEST Academy.
        </p>

        <div class="gallery">
          <figure>
            <img
              src="./debestpics/cultural/dansoman_cultural_dance.jpeg"
              alt="Students performing a cultural dance"
              loading="lazy"
              tabindex="0"
              data-full="./debestpics/cultural/dansoman_cultural_dance.jpeg"
            />
            <figcaption>Cultural Dance</figcaption>
          </figure>

          <figure>
            <img
              src="./debestpics/CHOIR.jpeg"
              alt="School choir performance"
              loading="lazy"
              tabindex="0"
              data-full="./debestpics/CHOIR.jpeg"
            />
            <figcaption>Choir</figcaption>
          </figure>

          <figure>
            <img
              src="./debestpics/xupremerose.jpeg"
              alt="Students celebrating at a school event"
              loading="lazy"
              tabindex="0"
              data-full="./debestpics/xupremerose.jpeg"
            />
            <figcaption>Celebration Day</figcaption>
          </figure>

          <figure>
            <img
              src="./debestpics/Kasoa_speech.jpeg"
              alt="Speech and leadership event"
              loading="lazy"
              tabindex="0"
              data-full="./debestpics/Kasoa_speech.jpeg"
            />
            <figcaption>Speech & Leadership</figcaption>
          </figure>

          <figure>
            <img
              src="./debestpics/cultural/kasoa_cultural_dance.jpeg"
              alt="Students in a cultural dance routine"
              loading="lazy"
              tabindex="0"
              data-full="./debestpics/cultural/kasoa_cultural_dance.jpeg"
            />
            <figcaption>School Culture</figcaption>
          </figure>

          <figure>
            <img
              src="./debestpics/kgpoem.jpeg"
              alt="Kindergarten learners reciting a poem"
              loading="lazy"
              tabindex="0"
              data-full="./debestpics/kgpoem.jpeg"
            />
            <figcaption>KG Poem Recital</figcaption>
          </figure>
        </div>
      </section>
    </main>
    <script src="./debest.js"></script>
  </body>
</html>
