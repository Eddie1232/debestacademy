<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>DEBEST ADMIN - Headmaster Dashboard</title>
  <script src="./admin-shared.js"></script>
  <script>
    window.DEBEST_EXPECTED_ROLE = 'Headmaster';
    if (!window.DebestAdmin || !DebestAdmin.requireAuth('Headmaster')) {
      /* requireAuth redirects */
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #fff8f0; }
    .shell-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 8px 14px;
      background: #341f4d;
      color: #fff8f0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      font-weight: 800;
      font-size: 0.9rem;
    }
    .shell-banner a {
      color: #fff8f0;
      text-decoration: none;
      opacity: 0.9;
      margin-left: 12px;
      font-weight: 700;
    }
    .shell-banner a:hover { text-decoration: underline; opacity: 1; }
    #dashFrame {
      width: 100%;
      height: calc(100vh - 38px);
      border: 0;
      display: block;
      background: #fff8f0;
    }
  </style>
</head>
<body>
  <div class="shell-banner">
    <span>Headmaster workspace · final approvals &amp; calendar oversight</span>
    <span>
      <a href="../debest.html" target="_blank" rel="noopener">Public site</a>
      <a href="./login.html" id="shellLogout">Switch account</a>
    </span>
  </div>
  <iframe
    id="dashFrame"
    title="Headmaster Dashboard"
    src="./terms-calendar-admin-base.html?role=Headmaster&embedded=1"
  ></iframe>
  <script>
    document.getElementById('shellLogout')?.addEventListener('click', function (e) {
      e.preventDefault();
      if (window.DebestAdmin) DebestAdmin.logout(true);
      else window.location.href = './login.html';
    });
  </script>
</body>
</html>
