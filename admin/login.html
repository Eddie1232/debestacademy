<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>DEBEST ACADEMY - Staff Login</title>
  <link rel="stylesheet" href="../debest.css" />
  <style>
    body { margin: 0; background: #fff8f0; }
    .auth-card {
      background: #fff8f0;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(124, 101, 144, 0.12);
      padding: 28px 22px;
      margin: 80px auto 40px;
      max-width: 440px;
    }
    .pill {
      background: #341f4d;
      color: #fff8f0;
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 900;
      letter-spacing: 0.4px;
      display: inline-block;
      margin-bottom: 12px;
    }
    label { font-weight: 800; color: #5a3e72; display: block; margin-top: 12px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #d9cde6;
      border-radius: 10px;
      background: #fdf9fb;
      font-weight: 600;
      margin-top: 6px;
      box-sizing: border-box;
    }
    .cal-btn {
      background: #5a3e72;
      color: #fff8f0;
      border: none;
      padding: 12px 16px;
      font-weight: 900;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      margin-top: 16px;
    }
    .cal-btn:hover { background: #7e628f; }
    .cal-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .muted { color: #6d587a; font-weight: 600; }
    .danger { color: #b11f2e; font-weight: 900; }
    .success { color: #5a3e72; font-weight: 900; }
    .top-links {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      z-index: 10;
    }
    .top-links a {
      background: #5a3e72;
      color: #fff8f0;
      padding: 10px 12px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 900;
      box-shadow: 0 5px 20px rgba(124, 101, 144, 0.18);
    }
  </style>
</head>
<body>
  <div class="top-links">
    <a href="../debest.html">← Public site</a>
  </div>

  <main class="container" role="main">
    <div class="auth-card" aria-live="polite">
      <div class="pill">STAFF ONLY</div>
      <h1 style="margin: 0 0 8px; color: #341f4d; font-size: 1.6rem;">Admin login</h1>
      <p class="muted" style="margin: 0 0 14px;">
        Sign in with your school credentials. You will be taken to your role dashboard
        (Secretary, Manager, or Headmaster).
      </p>

      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <button class="cal-btn" id="loginBtn" type="submit">Login</button>
      </form>

      <p id="authMsg" style="margin-top: 14px; font-weight: 900;"></p>
      <button id="retryBtn" class="cal-btn" type="button" style="display: none;">Retry connection</button>
      <p class="muted" style="margin-top: 12px; font-size: 0.9rem;">
        Use the same host address as the public website (e.g. <code>http://192.168.x.x:5500</code>).
        Only one school computer should run the server.
      </p>
    </div>
  </main>

  <script src="./admin-shared.js"></script>
  <script>
    (function () {
      const authMsg = document.getElementById('authMsg');
      const retryBtn = document.getElementById('retryBtn');
      const loginBtn = document.getElementById('loginBtn');
      const form = document.getElementById('loginForm');

      if (window.DebestAdmin.redirectIfLoggedIn()) return;

      async function ensureServer() {
        const up = await DebestAdmin.checkServer();
        if (!up) {
          authMsg.textContent = 'Admin server is not reachable. Start the server on the host PC (npm start).';
          authMsg.className = 'danger';
          retryBtn.style.display = 'block';
          loginBtn.disabled = true;
          return false;
        }
        authMsg.textContent = '';
        authMsg.className = '';
        retryBtn.style.display = 'none';
        loginBtn.disabled = false;
        return true;
      }

      retryBtn.addEventListener('click', ensureServer);
      ensureServer();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        authMsg.textContent = '';
        authMsg.className = '';
        loginBtn.disabled = true;

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        try {
          const up = await ensureServer();
          if (!up) return;

          const result = await DebestAdmin.login(username, password);
          authMsg.textContent = 'Login successful. Redirecting…';
          authMsg.className = 'success';

          // Role dashboards are relative to /admin/
          const path = DebestAdmin.dashboardForRole(result.role);
          window.location.replace(path);
        } catch (err) {
          authMsg.textContent = (err && err.message) ? err.message : 'Login failed';
          authMsg.className = 'danger';
          loginBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
