<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Operations | Debest Academy</title><link rel="stylesheet" href="admin.css"><style>.ops{max-width:1200px;margin:24px auto;padding:0 18px}.opshead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.opsgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:18px 0}.panel{background:#fff;border:1px solid var(--admin-border);padding:18px;min-width:0;box-shadow:var(--admin-shadow)}.panel h2{margin-top:0}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-weight:700}.field input,.field select{padding:9px;min-height:40px;width:100%;box-sizing:border-box}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.table-wrap{overflow:auto;margin-top:12px}table{border-collapse:collapse;width:100%;min-width:600px}td,th{padding:9px;border-bottom:1px solid var(--admin-border);text-align:left}th{background:#f3f5f7}.notice{padding:10px;background:var(--admin-soft);border-left:4px solid var(--admin-accent-2);margin-top:10px;white-space:pre-wrap}.error{border-color:#a63d38}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.metric{padding:12px;background:var(--admin-soft)}.metric small{display:block;color:var(--admin-muted)}.metric strong{font-size:1.3rem}@media(max-width:800px){.opsgrid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main class="ops"><header class="opshead"><div><h1>School Operations</h1><p class="muted">Student register, attendance, fee invoices and payments.</p></div><div class="actions"><a class="btn btn-ghost" href="/admin/academic-tools.html">Academic CSV & KPIs</a><button id="logout" class="btn" type="button">Log out</button></div></header><div id="status" class="notice" aria-live="polite">Loading school data…</div><section class="panel"><h2>School overview</h2><div id="overview" class="cards"></div><div class="actions"><button class="btn" id="generateInsights" type="button">Generate DataPulse AI insights</button></div><div id="insights" class="notice" aria-live="polite">Insights use aggregate school metrics only.</div></section><div class="opsgrid"><section class="panel" data-role-access="records"><h2>Student register</h2><form id="studentForm"><div class="fields"><div class="field"><label for="studentId">Student ID *</label><input id="studentId" required maxlength="80"></div><div class="field"><label for="fullName">Full name *</label><input id="fullName" required maxlength="160"></div><div class="field"><label for="studentSection">Section *</label><select id="studentSection"><option>JHS</option><option>Primary</option><option>KG</option></select></div><div class="field"><label for="className">Class</label><input id="className" placeholder="JHS 1"></div><div class="field"><label for="admissionDate">Admission date</label><input id="admissionDate" type="date"></div><div class="field"><label for="guardianName">Guardian name</label><input id="guardianName" maxlength="160"></div><div class="field"><label for="guardianPhone">Guardian phone</label><input id="guardianPhone" maxlength="40"></div></div><div class="actions"><button class="btn" type="submit">Add student</button><button class="btn btn-ghost" id="loadStudents" type="button">Refresh register</button></div></form><div id="studentMsg" aria-live="polite"></div><div class="fields" style="margin-top:12px"><div class="field"><label for="studentSearch">Search register</label><input id="studentSearch" placeholder="ID, name or class"></div><div class="field"><label for="filterSection">Section filter</label><select id="filterSection"><option value="">All sections</option><option>KG</option><option>Primary</option><option>JHS</option></select></div></div><div id="studentsTable" class="table-wrap"></div></section><section class="panel" data-role-access="records"><h2>Attendance register</h2><form id="attendanceForm"><div class="fields"><div class="field"><label for="attDate">Date</label><input id="attDate" type="date" required></div><div class="field"><label for="attSection">Section</label><select id="attSection"><option>JHS</option><option>Primary</option><option>KG</option></select></div><div class="field"><label for="attClass">Class</label><input id="attClass" placeholder="JHS 1" required></div></div><div class="actions"><button class="btn btn-ghost" id="loadAttendance" type="button">Load class</button><button class="btn" type="submit">Save attendance</button></div></form><div id="attendanceMsg" aria-live="polite"></div><div id="attendanceTable" class="table-wrap"></div></section><section class="panel" data-role-access="finance"><h2>Create fee invoice</h2><form id="invoiceForm"><div class="fields"><div class="field"><label for="invoiceStudent">Student ID *</label><input id="invoiceStudent" list="feeStudents" required><datalist id="feeStudents"></datalist></div><div class="field"><label for="invoiceYear">Academic year *</label><input id="invoiceYear" placeholder="2026/2027" required></div><div class="field"><label for="invoiceTerm">Term</label><select id="invoiceTerm"><option>Term 1</option><option>Term 2</option><option>Term 3</option></select></div><div class="field"><label for="invoiceAmount">Amount (GHS) *</label><input id="invoiceAmount" type="number" min="0.01" step="0.01" required></div><div class="field"><label for="invoiceDesc">Description *</label><input id="invoiceDesc" placeholder="Tuition fee" required></div><div class="field"><label for="invoiceDue">Due date</label><input id="invoiceDue" type="date"></div></div><div class="actions"><button class="btn" type="submit">Create invoice</button></div></form><div id="invoiceMsg" aria-live="polite"></div></section><section class="panel" data-role-access="finance"><h2>Record payment</h2><form id="paymentForm"><div class="fields"><div class="field"><label for="paymentInvoice">Invoice ID *</label><input id="paymentInvoice" type="number" min="1" required></div><div class="field"><label for="paymentAmount">Amount (GHS) *</label><input id="paymentAmount" type="number" min="0.01" step="0.01" required></div><div class="field"><label for="paymentMethod">Method</label><select id="paymentMethod"><option value="mobile_money">Mobile Money</option><option value="cash">Cash</option><option value="bank_transfer">Bank transfer</option><option value="cheque">Cheque</option><option value="other">Other</option></select></div><div class="field"><label for="paymentRef">Transaction reference</label><input id="paymentRef" maxlength="100"></div></div><div class="actions"><button class="btn" type="submit">Record payment</button><button class="btn btn-ghost" id="loadFees" type="button">Refresh fee ledger</button></div></form><div id="paymentMsg" aria-live="polite"></div></section></div><section class="panel" data-role-access="finance"><h2>Fee ledger</h2><div id="feesTable" class="table-wrap"></div></section></main><script src="admin-shared.js"></script><script src="school-operations.js"></script></body></html>
